name: matcha

x-database-environment: &database-environment
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - matcha_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20

  schema:
    image: matcha-backend-local
    environment:
      <<: *database-environment
    command: ["python", "initdb.py"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: matcha-backend-local
    environment:
      <<: *database-environment
    command: ["python", "seed.py"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - matcha_uploads:/app/uploads

  backend:
    image: matcha-backend-local
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      <<: *database-environment
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - matcha_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ./frontend/my-app
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
        NEXT_PUBLIC_MAP_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
        NEXT_PUBLIC_WEBRTC_STUN_URL: stun:stun.l.google.com:19302
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  matcha_pg_data:
    name: backend_matcha_pg_data

  matcha_uploads:
    name: matcha_uploads
