services:
  db:
    image: postgres:16-alpine
    container_name: matcha_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: matcha
      POSTGRES_PASSWORD: matcha_dev_password
      POSTGRES_DB: matcha
    ports:
      - "5432:5432"
    volumes:
      - matcha_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcha -d matcha"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  matcha_pg_data:
